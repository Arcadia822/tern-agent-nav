name: Syntax checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Luau and Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact requested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install the pinned Luau compiler
        run: npm install --prefix "$RUNNER_TEMP/luau-syntax" --ignore-scripts --no-audit --no-fund luau-web@1.5.1

      - name: Compile the production Luau entrypoint
        env:
          LUAU_COMPILER_MODULE: ${{ runner.temp }}/luau-syntax/node_modules/luau-web/src/index.js
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const { LuauState } = await import(pathToFileURL(process.env.LUAU_COMPILER_MODULE).href);
          const state = await LuauState.createAsync();
          try {
            state.loadstring(readFileSync('window.luau', 'utf8'), 'window.luau', true);
            console.log('Production window.luau compiled successfully.');
          } finally {
            state.destroy();
          }
          NODE

      # Native Tern/UI scenarios require their separate native verification environment.
      - name: Check the native-driver Python syntax
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/native-driver-pycache
        run: python3 -m py_compile tests/smoke.py tests/width_regression.py
